# Netlify build configuration for the React + Vite portfolio (repo root).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: serve the app shell for any path so client-side anchors resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
